<!doctype html>
<html><head><meta charset="utf-8"><title>My Experience - Acme Careers</title>
<style>
  ul[role=listbox], [data-automation-id=activeListContainer] { position: absolute; z-index: 10; width: 344px;
    max-height: 200px; overflow-y: auto; margin: 0; padding: 0; list-style: none; background: #fff; border: 1px solid #999; }
  li[role=option] { height: 32px; line-height: 32px; padding: 0 8px; }
  button[aria-haspopup] { width: 344px; height: 40px; text-align: left; }
</style></head>
<body>
<!-- A local stand-in for Workday's "My Experience" page, copied from a live one: role=group sections labelled by
     their <h4 id="Work-Experience-section">, an "Add" button (data-automation-id=add-button, "Add Another" once a
     block exists) that adds a block headed <h5 id="Work-Experience-N-panel">, dates as Month / Year spin buttons
     that only take typed keys (a value set from outside is reset), Degree as a "Select One" button, Field of Study
     and Skills as search-and-pick prompts (search on Enter; picks show as pills), and a resume drop zone whose
     input is cleared once the upload is taken, the file then listed beside it. Flags: #uploaded=<name> (a file
     is already uploaded), #blank=<n> (n blank Work Experience blocks already open), #noce (Field of Study lacks
     "Computer Engineering", offering only look-alikes), #school=dropdown (School is a "Select One" list of US
     universities: "University of Wisconsin" but not "-Madison"). Records window.uploads. -->
<h3>My Experience</h3>
<div role="group" aria-labelledby="Work-Experience-section"><h4 id="Work-Experience-section">Work Experience</h4>
  <div class="blocks"></div><button type="submit" data-automation-id="add-button">Add</button></div>
<div role="group" aria-labelledby="Education-section"><h4 id="Education-section">Education</h4>
  <div class="blocks"></div><button type="submit" data-automation-id="add-button">Add</button></div>
<div role="group" aria-labelledby="Skills-section"><h4 id="Skills-section">Skills</h4>
  <div data-automation-id="formField-skills"><label for="skills--skills">Type to Add Skills</label>
    <div data-automation-id="multiSelectContainer" data-uxi-widget-type="multiselect"><div data-automation-id="selectedItemList"></div>
      <input id="skills--skills" type="text" data-uxi-widget-type="selectinput" data-automation-id="searchBox" placeholder="Search" autocomplete="off"></div></div></div>
<div role="group" aria-labelledby="Resume/CV-section"><h4 id="Resume/CV-section">Resume/CV</h4>
  <div data-automation-id="formField-" data-fkit-id="resumeAttachments--attachments"><label id="label5"><span>Upload a file (5MB max)<abbr aria-hidden="true">*</abbr></span></label>
    <div data-automation-id="attachments-FileUpload" aria-labelledby="label5">
      <div data-automation-id="file-upload-drop-zone"><div>Drop files here</div><div>or</div>
        <button type="button" data-automation-id="select-files" id="resumeAttachments--attachments"><span>Select files</span></button></div>
      <input data-automation-id="file-upload-input-ref" type="file" multiple>
      <div class="files"></div></div></div></div>
<script>
const flags = new URLSearchParams(location.hash.slice(1));
const SKILLS = ["Interactive SQL", "SQL", "SQL Server", "Python (Programming Language)", "Docker - Micron", "Docker",
                "PyTorch", "Kubernetes Operations", "Git", "GitHub"];
const FIELDS = flags.has("noce")
  ? ["Computer Engineering Technology", "Computer Science", "Data Science", "Electrical and Computer Engineering", "Mathematics"]
  : ["Computer Engineering", "Computer Science", "Data Science", "Electrical Engineering", "Mathematics"];
const SCHOOLS = ["Stanford University", "University of Michigan", "University of Wisconsin", "University of Wisconsin-Milwaukee", "Other"];
const DEGREES = ["High School Diploma", "Associate's Degree", "Bachelor's Degree", "Master's Degree", "Doctorate (PhD)"];
let serial = 5;
window.uploads = 0;
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };

// ---- Month / Year spin buttons: typed digits only, like a controlled input that ignores outside writes.
function spin(input, digits) {
  let keyed = "";
  input.addEventListener("keydown", (e) => {
    if (/^\d$/.test(e.key)) { keyed = (keyed + e.key).slice(-digits); e.preventDefault(); }
    else if (e.key === "Backspace" || e.key === "Delete") { keyed = ""; e.preventDefault(); }
    else return;
    input.value = keyed;
  });
  input.addEventListener("input", () => { input.value = keyed; });
}
const dateField = (k, name, legend, parts) => el(`<div data-automation-id="formField-${name}" data-fkit-id="${k}--${name}">
  <fieldset><legend>${legend}</legend><div data-automation-id="dateInputWrapper">${parts.map((p) =>
    `<input type="text" role="spinbutton" aria-label="${p}" data-automation-id="dateSection${p}-input" id="${k}--${name}-dateSection${p}-input">`).join("")}</div></fieldset></div>`);
const text = (k, name, label, req) => el(`<div data-automation-id="formField-${name}" data-fkit-id="${k}--${name}"><label for="${k}--${name}"><span>${label}${req ? '<abbr aria-hidden="true">*</abbr>' : ""}</span></label><div><div><input type="text" id="${k}--${name}" name="${name}" aria-required="${!!req}"></div></div></div>`);

// ---- A "Select One" button with its list at the page's end.
let openList = null;
function closeList() { if (openList) { openList.ul.remove(); openList.button.setAttribute("aria-expanded", "false"); openList = null; } }
function dropdown(button, options) {
  button.addEventListener("click", () => {
    if (openList && openList.button === button) return closeList();
    closeList();
    const ul = el(`<ul role="listbox" id="evv${serial++}"></ul>`);
    ["Select One", ...options].forEach((t, i) => {
      const li = el(`<li role="option"><div>${t}</div></li>`);
      if (!i) li.setAttribute("aria-disabled", "true");
      else li.addEventListener("click", () => { button.textContent = t; closeList(); });
      ul.appendChild(li);
    });
    const r = button.getBoundingClientRect();
    ul.style.top = `${r.bottom + scrollY}px`; ul.style.left = `${r.left}px`;
    document.body.appendChild(ul);
    button.setAttribute("aria-expanded", "true"); button.setAttribute("aria-controls", ul.id);
    openList = {ul, button};
  });
  button.addEventListener("keydown", (e) => { if (e.key === "Escape") closeList(); });
}

// ---- Search-and-pick prompt: Enter shows the entries containing the text; a click adds a pill.
function prompt(input, catalogue) {
  const box = input.closest("[data-automation-id^='formField']");
  const pills = box.querySelector("[data-automation-id=selectedItemList]");
  let list = null;
  const close = () => { if (list) { list.remove(); list = null; } };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape") return close();
    if (e.key !== "Enter") return;
    e.preventDefault(); close();
    const q = input.value.trim().toLowerCase();
    list = el(`<div data-automation-id="activeListContainer" role="listbox"></div>`);
    const hits = catalogue.filter((c) => c.toLowerCase().includes(q));
    if (!hits.length) list.appendChild(el("<div>No Items.</div>"));
    hits.forEach((h) => {
      const o = el(`<div role="option" data-automation-id="promptOption" data-automation-label="${h}"><span>${h}</span></div>`);
      o.addEventListener("click", () => {
        pills.appendChild(el(`<div data-automation-id="selectedItem" title="${h}"><span>${h}</span></div>`));
        input.value = ""; close();
      });
      list.appendChild(o);
    });
    const r = input.getBoundingClientRect();
    list.style.top = `${r.bottom + scrollY}px`; list.style.left = `${r.left}px`;
    document.body.appendChild(list);
  });
}
document.addEventListener("mousedown", (e) => {
  if (openList && !openList.ul.contains(e.target) && e.target !== openList.button) closeList();
});

// ---- Add: one block per click, numbered like Workday's.
function addWork(group) {
  const k = `workExperience-${serial++}`, n = group.querySelectorAll("h5").length + 1;
  const block = el(`<div><div><h5 id="Work-Experience-${n}-panel">Work Experience ${n}</h5><button type="submit">Delete</button></div><div data-fkit-id="${k}--null"></div></div>`);
  const body = block.lastChild;
  body.append(text(k, "jobTitle", "Job Title", true), text(k, "companyName", "Company", true), text(k, "location", "Location"));
  body.appendChild(el(`<div data-automation-id="formField-currentlyWorkHere"><label for="${k}--currentlyWorkHere">I currently work here</label><input id="${k}--currentlyWorkHere" type="checkbox" name="currentlyWorkHere"></div>`));
  body.append(dateField(k, "startDate", "From<abbr>*</abbr>", ["Month", "Year"]), dateField(k, "endDate", "To<abbr>*</abbr>", ["Month", "Year"]));
  body.appendChild(el(`<div data-automation-id="formField-roleDescription"><label for="${k}--roleDescription">Role Description</label><textarea id="${k}--roleDescription"></textarea></div>`));
  body.querySelectorAll("[role=spinbutton]").forEach((s) => spin(s, /Month/.test(s.id) ? 2 : 4));
  body.querySelector("[type=checkbox]").addEventListener("change", (e) => {   // "I currently work here" hides To
    body.querySelector("[data-automation-id=formField-endDate]").hidden = e.target.checked;
  });
  return block;
}
function addEducation(group) {
  const k = `education-${serial++}`, n = group.querySelectorAll("h5").length + 1;
  const block = el(`<div><div><h5 id="Education-${n}-panel">Education ${n}</h5><button type="submit">Delete</button></div><div data-fkit-id="${k}--null"></div></div>`);
  const body = block.lastChild;
  if (flags.get("school") === "dropdown") {
    body.appendChild(el(`<div data-automation-id="formField-school"><label for="${k}--school">School or University<abbr>*</abbr></label><button aria-haspopup="listbox" type="button" aria-label="School or University Select One Required" id="${k}--school" name="school" aria-expanded="false">Select One</button></div>`));
    dropdown(body.querySelector("[name=school]"), SCHOOLS);
  } else body.appendChild(text(k, "schoolName", "School or University", true));
  body.appendChild(el(`<div data-automation-id="formField-degree"><label for="${k}--degree">Degree<abbr>*</abbr></label><button aria-haspopup="listbox" type="button" aria-label="Degree Select One Required" id="${k}--degree" name="degree" aria-expanded="false">Select One</button></div>`));
  body.appendChild(el(`<div data-automation-id="formField-fieldOfStudy"><label for="${k}--fieldOfStudy">Field of Study</label><div data-automation-id="multiSelectContainer"><div data-automation-id="selectedItemList"></div><input id="${k}--fieldOfStudy" type="text" data-uxi-widget-type="selectinput" placeholder="Search"></div></div>`));
  body.appendChild(text(k, "gradeAverage", "Overall Result (GPA)"));
  body.append(dateField(k, "firstYearAttended", "From", ["Year"]), dateField(k, "lastYearAttended", "To (Actual or Expected)", ["Year"]));
  body.querySelectorAll("[role=spinbutton]").forEach((s) => spin(s, 4));
  dropdown(body.querySelector("[name=degree]"), DEGREES);
  prompt(body.querySelector("[data-uxi-widget-type=selectinput]"), FIELDS);
  return block;
}
for (const [section, make] of [["Work-Experience-section", addWork], ["Education-section", addEducation]]) {
  const group = document.querySelector(`[aria-labelledby="${section}"]`);
  const add = group.querySelector("[data-automation-id=add-button]");
  add.addEventListener("click", () => {
    setTimeout(() => { group.querySelector(".blocks").appendChild(make(group)); add.textContent = "Add Another"; }, 300);
  });
}
for (let i = 0; i < Number(flags.get("blank") || 0); i++) {
  const group = document.querySelector("[aria-labelledby=Work-Experience-section]");
  group.querySelector(".blocks").appendChild(addWork(group));
}
prompt(document.getElementById("skills--skills"), SKILLS);

// ---- Resume: the input is cleared once the upload is taken; the file is listed beside it.
const files = document.querySelector(".files"), input = document.querySelector("input[type=file]");
const listFile = (name) => files.appendChild(el(`<div data-automation-id="file-upload-item"><button data-automation-id="file-upload-item-name">${name}</button><div>Successfully Uploaded!</div><button aria-label="Delete">x</button></div>`));
if (flags.get("uploaded")) listFile(flags.get("uploaded"));
input.addEventListener("change", () => {
  const picked = Array.from(input.files).map((f) => f.name);
  setTimeout(() => { picked.forEach(listFile); window.uploads += picked.length; input.value = ""; }, 600);
});
</script>
</body></html>
