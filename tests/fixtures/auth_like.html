<!doctype html>
<html><head><meta charset="utf-8"><title>Candidate Home - Acme Careers</title></head>
<body>
<!-- A local stand-in for a portal login (Workday-like): sign in, create account with terms and a
     honeypot, an emailed verification code, then the application form. Accounts live in memory;
     #existing=email|password preloads one, #code=none skips verification. -->
<div id="signin" class="view">
  <form id="f1"><h2>Sign In</h2>
    <label for="e1">Email Address</label><input id="e1" type="text" name="email">
    <label for="p1">Password</label><input id="p1" type="password">
    <input name="beecatcher" data-automation-id="beecatcher" type="text" tabindex="-1" style="position:absolute;left:-9999px">
    <div class="error" id="err1" role="alert"></div>
    <button type="submit">Sign In</button>
  </form>
  <button id="toCreate" type="button">Create Account</button>
</div>
<div id="create" class="view" hidden>
  <form id="f2"><h2>Create Account</h2>
    <label for="e2">Email Address</label><input id="e2" type="email">
    <label for="p2">Password</label><input id="p2" type="password">
    <label for="p3">Verify New Password</label><input id="p3" type="password">
    <label><input id="terms" type="checkbox"> I agree to the terms and the applicant privacy policy</label>
    <input name="beecatcher" data-automation-id="beecatcher" type="text" tabindex="-1" style="position:absolute;left:-9999px">
    <div class="error" id="err2" role="alert"></div>
    <button type="submit">Create Account</button>
  </form>
  <button id="toSignin" type="button">Sign In</button>
</div>
<div id="verify" class="view" hidden>
  <form id="f3"><p>We have sent a verification code to your email.</p>
    <label for="code">Verification code</label><input id="code" type="text">
    <button type="submit">Verify</button>
  </form>
</div>
<div id="app" class="view" hidden><h2>My Information</h2><label for="fn">First Name</label><input id="fn"></div>
<script>
const accounts = {};
const params = new URLSearchParams(location.hash.slice(1));
if (params.get("existing")) { const [e, p] = params.get("existing").split("|"); accounts[e] = p; }
const needCode = params.get("code") !== "none";
window.trapFilled = false;
const show = (id) => document.querySelectorAll(".view").forEach((v) => { v.hidden = v.id !== id; });
const trapped = (form) => { if (form.querySelector("[name=beecatcher]").value) window.trapFilled = true; };
document.getElementById("toCreate").onclick = () => show("create");
document.getElementById("toSignin").onclick = () => show("signin");
document.getElementById("f1").onsubmit = (ev) => {
  ev.preventDefault(); trapped(ev.target);
  const email = document.getElementById("e1").value, pw = document.getElementById("p1").value;
  if (accounts[email] && accounts[email] === pw) show("app");
  else document.getElementById("err1").textContent = "Incorrect email or password.";
};
document.getElementById("f2").onsubmit = (ev) => {
  ev.preventDefault(); trapped(ev.target);
  const err = document.getElementById("err2");
  const email = document.getElementById("e2").value, pw = document.getElementById("p2").value;
  if (!document.getElementById("terms").checked) { err.textContent = "You must accept the terms."; return; }
  if (pw !== document.getElementById("p3").value) { err.textContent = "Passwords do not match."; return; }
  if (accounts[email]) { err.textContent = "An account with this email address already exists."; return; }
  accounts[email] = pw; window.created = [email, pw]; show(needCode ? "verify" : "app");
};
document.getElementById("f3").onsubmit = (ev) => {
  ev.preventDefault();
  if (document.getElementById("code").value === "123456") show("app");
};
</script>
</body></html>
